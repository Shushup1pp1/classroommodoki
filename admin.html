/* =========================================
   Cookie
========================================= */

function getCookie(name){

    const cookies =
        document.cookie.split("; ");

    for(const cookie of cookies){

        const parts =
            cookie.split("=");

        if(parts[0] === name){

            return parts
                .slice(1)
                .join("=");

        }

    }

    return null;

}


/* =========================================
   HTML escape
========================================= */

function escapeHTML(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   Admin認証
========================================= */

async function checkAdmin(){

    const sessionToken =
        getCookie("session");

    if(!sessionToken){

        alert("ログインしてください");

        location.href =
            "login.html";

        return false;

    }


    const {
        data:sessionData,
        error:sessionError
    } =
        await supabaseClient
        .from("sessions")
        .select("username")
        .eq(
            "session_token",
            sessionToken
        )
        .limit(1);


    if(
        sessionError ||
        !sessionData ||
        sessionData.length === 0
    ){

        alert("セッションが無効です");

        location.href =
            "login.html";

        return false;

    }


    currentUsername =
        sessionData[0].username;


    const {
        data:userData,
        error:userError
    } =
        await supabaseClient
        .from("users")
        .select("username,role")
        .eq(
            "username",
            currentUsername
        )
        .limit(1);


    if(
        userError ||
        !userData ||
        userData.length === 0
    ){

        alert("ユーザーが存在しません");

        location.href =
            "home.html";

        return false;

    }


    if(
        userData[0].role !== "admin"
    ){

        alert("管理者権限がありません");

        location.href =
            "home.html";

        return false;

    }


    document.getElementById(
        "loginUser"
    ).textContent =
        "👑 " + currentUsername;


    console.log(
        "✅ 管理者認証成功"
    );

    return true;

}


/* =========================================
   クラスを開く
========================================= */

async function openClass(){

    const input =
        document.getElementById(
            "classCode"
        );

    currentClassCode =
        input.value
        .trim()
        .toUpperCase();


    if(!currentClassCode){

        alert(
            "クラスコードを入力してください"
        );

        return;

    }


    /*
       クラスが存在するか確認
    */

    const {
        data,
        error
    } =
        await supabaseClient
        .from("classes")
        .select("class_code")
        .eq(
            "class_code",
            currentClassCode
        )
        .limit(1);


    if(error){

        console.error(error);

        alert(
            "クラス情報の取得に失敗しました"
        );

        return;

    }


    if(!data || data.length === 0){

        alert(
            "そのクラスは存在しません"
        );

        return;

    }


    document.getElementById(
        "adminPanel"
    ).style.display =
        "block";


    document.getElementById(
        "currentClassText"
    ).textContent =
        "現在: " + currentClassCode;


    showDashboard();

}

/* =========================================
   Users
========================================= */

async function showMembers(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML =
        "<h2>👥 ユーザー管理</h2>" +
        "<p>読み込み中...</p>";


    const {
        data:members,
        error:memberError
    } =
        await supabaseClient
        .from("class_members")
        .select("username")
        .eq(
            "class_code",
            currentClassCode
        );


    if(memberError){

        console.error(memberError);

        content.innerHTML =
            "メンバー取得失敗";

        return;

    }


    if(!members.length){

        content.innerHTML = `

            <h2>👥 ユーザー管理</h2>

            <div class="empty">
                メンバーはいません
            </div>

        `;

        return;

    }


    const usernames =
        members.map(
            m => m.username
        );


    const {
        data:users,
        error:userError
    } =
        await supabaseClient
        .from("users")
        .select(
            "username,role,chat_muted"
        )
        .in(
            "username",
            usernames
        );


    if(userError){

        console.error(userError);

        content.innerHTML =
            "ユーザー情報の取得に失敗しました";

        return;

    }


    content.innerHTML =
        "<h2>👥 ユーザー管理</h2>";


    users.forEach(user=>{

        let roleText =
            "🎓 Student";

        let roleClass =
            "status-student";


        if(user.role === "teacher"){

            roleText =
                "👨‍🏫 Teacher";

            roleClass =
                "status-teacher";

        }


        if(user.role === "admin"){

            roleText =
                "👑 Admin";

            roleClass =
                "status-admin";

        }


        const muteText =
            user.chat_muted
            ? "🔇 ミュート中"
            : "💬 通常";


        content.innerHTML += `

            <div class="admin-card">

                <h3>
                    👤
                    ${escapeHTML(user.username)}
                </h3>

                <span
                    class="status ${roleClass}">
                    ${roleText}
                </span>

                <span
                    class="status ${
                        user.chat_muted
                        ? "status-muted"
                        : ""
                    }">
                    ${muteText}
                </span>

                <hr>

                <button
                    class="button warning"
                    onclick="muteUser(
                        '${escapeHTML(user.username)}'
                    )">

                    🔇
                    ${
                        user.chat_muted
                        ? "ミュート解除"
                        : "ミュート"
                    }

                </button>


                <button
                    class="button"
                    onclick="kickUser(
                        '${escapeHTML(user.username)}'
                    )">

                    👢 キック

                </button>


                <button
                    class="button danger"
                    onclick="banUser(
                        '${escapeHTML(user.username)}'
                    )">

                    🔨 BAN

                </button>


                <br>


                <button
                    class="button"
                    onclick="setRole(
                        '${escapeHTML(user.username)}',
                        'teacher'
                    )">

                    👨‍🏫 Teacher

                </button>


                <button
                    class="button"
                    onclick="setRole(
                        '${escapeHTML(user.username)}',
                        'admin'
                    )">

                    👑 Admin

                </button>


                <button
                    class="button"
                    onclick="setRole(
                        '${escapeHTML(user.username)}',
                        'student'
                    )">

                    🎓 Student

                </button>

            </div>

        `;

    });

}


/* =========================================
   Kick
========================================= */

async function kickUser(username){

    if(username === currentUsername){

        alert(
            "自分自身をキックすることはできません"
        );

        return;

    }


    if(!confirm(
        username +
        " をこのクラスからキックしますか？"
    )){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("class_members")
        .delete()
        .eq(
            "class_code",
            currentClassCode
        )
        .eq(
            "username",
            username
        );


    if(error){

        console.error(error);

        alert("キック失敗");

        return;

    }


    alert(
        username +
        " をキックしました"
    );


    showMembers();

}


/* =========================================
   Role
========================================= */

async function setRole(
    username,
    role
){

    if(username === currentUsername){

        alert(
            "自分自身のRoleは変更できません"
        );

        return;

    }


    if(!confirm(
        username +
        " を " +
        role +
        " に変更しますか？"
    )){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("users")
        .update({
            role:role
        })
        .eq(
            "username",
            username
        );


    if(error){

        console.error(error);

        alert("Role変更失敗");

        return;

    }


    alert(
        "Roleを変更しました"
    );


    showMembers();

}


/* =========================================
   Mute
========================================= */

async function muteUser(username){

    const {
        data,
        error:selectError
    } =
        await supabaseClient
        .from("users")
        .select("chat_muted")
        .eq(
            "username",
            username
        )
        .single();


    if(selectError){

        console.error(selectError);

        alert(
            "ユーザー情報を取得できませんでした"
        );

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("users")
        .update({

            chat_muted:
                !data.chat_muted

        })
        .eq(
            "username",
            username
        );


    if(error){

        console.error(error);

        alert("ミュート変更失敗");

        return;

    }


    showMembers();

}


/* =========================================
   BAN
========================================= */

async function banUser(username){

    if(username === currentUsername){

        alert(
            "自分自身をBANすることはできません"
        );

        return;

    }


    if(!confirm(
        username +
        " をBANしますか？"
    )){

        return;

    }


    /*
       class_bans テーブルを使用。

       必要な列:

       id
       class_code
       username
       created_at
    */


    const {
        error:banError
    } =
        await supabaseClient
        .from("class_bans")
        .insert({

            class_code:
                currentClassCode,

            username:
                username

        });


    if(banError){

        console.error(banError);

        alert(
            "BAN失敗\n" +
            banError.message
        );

        return;

    }


    await supabaseClient
    .from("class_members")
    .delete()
    .eq(
        "class_code",
        currentClassCode
    )
    .eq(
        "username",
        username
    );


    alert(
        username +
        " をBANしました"
    );


    showMembers();

}


/* =========================================
   Chat
========================================= */

async function showChat(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML =
        "<h2>💬 チャット管理</h2>" +
        "<p>読み込み中...</p>";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "class_code",
            currentClassCode
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        content.innerHTML =
            "チャット取得失敗";

        return;

    }


    if(!data.length){

        content.innerHTML = `

            <h2>💬 チャット管理</h2>

            <div class="empty">
                メッセージはありません
            </div>

        `;

        return;

    }


    content.innerHTML =
        "<h2>💬 チャット管理</h2>";


    data.forEach(msg=>{

        content.innerHTML += `

            <div class="admin-card">

                <h3>
                    💬
                    ${escapeHTML(msg.username)}
                </h3>

                <p>
                    ${escapeHTML(msg.message)}
                </p>

                <small>
                    ${new Date(
                        msg.created_at
                    ).toLocaleString("ja-JP")}
                </small>

                <br><br>

                <button
                    class="button danger"
                    onclick="deleteMessage(
                        ${msg.id}
                    )">

                    🗑 削除

                </button>

            </div>

        `;

    });

}


/* =========================================
   Delete Message
========================================= */

async function deleteMessage(id){

    if(!confirm(
        "このメッセージを削除しますか？"
    )){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("messages")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "class_code",
            currentClassCode
        );


    if(error){

        console.error(error);

        alert("削除失敗");

        return;

    }


    showChat();

}


/* =========================================
   Announcements
========================================= */

async function showAnnouncements(){

        document.getElementById(
            "content"

    content.innerHTML =
        "<h2>📢 お知らせ管理</h2>" +
        "<p>読み込み中...</p>";

       announcements テーブル想定:

       id

    if(error){

            <div class="empty">

                <br>

    if(!data.length){

        content.innerHTML = `

            <h2>📢 お知らせ管理</h2>

            <div class="empty">
                お知らせはありません
            </div>

        `;

        return;

    }


    content.innerHTML =
        "<h2>📢 お知らせ管理</h2>";


    data.forEach(a=>{

        content.innerHTML += `

            <div class="admin-card">

                <h3>
                    📢
                    ${escapeHTML(a.title)}
                </h3>

                <p>
                    ${escapeHTML(a.content)}
                </p>

                <small>
                    ${escapeHTML(a.author || "")}
                    <br>
                    ${new Date(
                        a.created_at
                    ).toLocaleString("ja-JP")}
                </small>

                <br><br>

                <button
                    class="button danger"
                    onclick="deleteAnnouncement(
                        ${a.id}
                    )">

                    🗑 削除

                </button>

            </div>

        `;

    });

}

        .delete()
        .eq(

            id
        )
        .eq(

        );


    if(error){

}

async function showFiles(){

   Download File
========================================= */

function downloadFile(url){

    if(!url){

        alert(
            "ファイルURLがありません"
        );

        return;

    }


    window.open(
        url,
        "_blank"
    );

}


/* =========================================
   Storage Path
========================================= */

function getStoragePath(fileUrl){

    if(!fileUrl){

        return null;

    }


    try{

        const url =
            new URL(fileUrl);

        const marker =
            "/object/public/class-files/";


        const index =
            url.pathname.indexOf(marker);


        if(index !== -1){

            return decodeURIComponent(
                url.pathname.substring(
                    index + marker.length
                )
            );

        }


        return null;

    }catch(error){

        console.error(error);

        return null;

    }

}


/* =========================================
   Delete File
========================================= */

async function deleteFile(
    id,
    fileUrl
){

    if(!confirm(
        "このファイルを削除しますか？"
    )){

        return;

    }


    const storagePath =
        getStoragePath(fileUrl);


    if(storagePath){

        const {
            error:storageError
        } =
            await supabaseClient
            .storage
            .from("class-files")
            .remove([
                storagePath
            ]);


        if(storageError){

            console.error(
                storageError
            );

            alert(
                "Storageからの削除に失敗しました"
            );

            return;

        }

    }


    const {
        error
    } =
        await supabaseClient
        .from("files")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "class_code",
            currentClassCode
        );


    if(error){

        console.error(error);

        alert(
            "ファイル情報の削除に失敗しました"
        );

        return;

    }


    showFiles();

}

async function editAssignment(id){

    } =
